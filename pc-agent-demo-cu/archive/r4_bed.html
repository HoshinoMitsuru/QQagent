<!DOCTYPE html>
<meta charset="utf-8">
<title>R4BED|booting</title>
<!--
  R4 实验台：被测目标是"一个 Chromium 窗口"，不是 QQ。

  ## 为什么不用 QQ 当被测目标
  QQ 在隐藏桌面上只能以**独立 profile**启动（单实例锁按 profile 区分），
  于是它是个未登录实例 —— 没有聊天页、没有输入框，WM_CHAR 无处可落，测了也白测。
  而 Chromium 的**窗口消息 → 焦点 renderer 宿主**这条路径是引擎级代码，
  QQ（Electron）走的是同一段。所以拿裸 Chromium 测，结论可以平移过去，
  而且：

    · 不需要登录
    · 不动用户的任何 profile（用临时 user-data-dir）
    · **状态可以读回** —— 我们把全部指标塞进 document.title

  ## 为什么把状态塞进标题
  标题是**唯一能跨桌面直读**的出口：`EnumWindows` 只枚举本桌面，
  但拿到 hwnd 之后 `GetWindowTextW` 照读不误。
  这样"隐藏桌面上到底发生了什么"就有了**自述证据**，
  再配合驱动进程侧读无障碍树，就是两个独立信源。

  ## 标题里每个字段在回答什么
    raf   —— rAF 回调累计次数。**只要还在涨，就说明 renderer 没被节流。**
             这是整个 R4 题目里最核心的一个数：被节流 = 读不到实时新消息。
    vis   —— document.visibilityState。Chromium 把"窗口被遮挡"映射成 hidden，
             所以在隐藏桌面上如果这里变成 hidden，说明遮挡判定**照样生效**。
    foc   —— document.hasFocus()。窗口消息能不能落到编辑区，先看这个。
    inp   —— input 事件累计次数。**这是"文字真的进去了"的硬证据**，
             不是"我们发了消息"，而是"页面承认收到了"。
    kb    —— keydown/beforeinput 累计次数。分得清"引擎投递了按键"与"编辑区吃了字"。
    ae    —— document.activeElement。**WM_CHAR 是投给"焦点元素"的**，
             没有可编辑元素持有焦点时，字符会被丢在 document 上 ——
             所以这一项必须报出来，否则"没写进去"会被误读成"消息通路不通"。
    te/td —— textarea / contenteditable 的当前内容。
             QQ 的消息编辑器是 contenteditable（ProseMirror），所以两种都要摆。

  ## 免责
  纯本地页面，不联网、不发请求、不读本地文件。
-->
<style>
  :root { color-scheme: dark; }
  body {
    margin: 0; padding: 28px 32px;
    background: #14161a; color: #e6e8ec;
    font: 14px/1.7 "Segoe UI", system-ui, sans-serif;
  }
  h1 { font-size: 17px; font-weight: 600; margin: 0 0 6px; }
  p.sub { margin: 0 0 22px; color: #8b93a1; font-size: 12.5px; }
  label { display: block; margin: 18px 0 6px; color: #8b93a1; font-size: 12px; }
  textarea, #ce {
    width: 100%; box-sizing: border-box;
    background: #1c1f25; color: #e6e8ec;
    border: 1px solid #2b3038; border-radius: 8px;
    padding: 12px 14px; font: inherit; outline: none;
  }
  textarea { height: 84px; resize: none; }
  #ce { min-height: 60px; }
  #ce:empty::before { content: attr(data-ph); color: #5b6270; }
  textarea:focus, #ce:focus { border-color: #4a7dff; }
  #metrics {
    margin-top: 24px; padding: 12px 14px;
    background: #1a1d23; border: 1px solid #262b33; border-radius: 8px;
    font-family: ui-monospace, Consolas, monospace; font-size: 12.5px;
    color: #9aa3b2; white-space: pre-wrap; word-break: break-all;
  }
</style>

<h1>R4 实验台</h1>
<p class="sub">本窗口被启动到独立 Windows 桌面上。所有指标实时写进窗口标题，供跨桌面读取。</p>

<label for="ta">textarea（原生可编辑，UIA 会投影 ValuePattern）</label>
<textarea id="ta" spellcheck="false" autofocus></textarea>

<label for="ce">contenteditable div（对应 QQ 的 ProseMirror 消息编辑器）</label>
<div id="ce" contenteditable="true" spellcheck="false" data-ph="在这里输入…"></div>

<div id="metrics">正在采集…</div>

<script>
(() => {
  "use strict";

  const rafCount = { n: 0 };
  let vis = document.visibilityState;
  let inp = 0, kb = 0, foc = 0, frames = 0, lastFpsAt = performance.now(), fps = 0;
  const t0 = performance.now();

  const ta = document.getElementById("ta");
  const ce = document.getElementById("ce");
  const box = document.getElementById("metrics");

  // rAF 泵：节流会让它停下来，这就是我们要看的那个"生命体征"。
  function pump() {
    rafCount.n++;
    frames++;
    const now = performance.now();
    if (now - lastFpsAt >= 1000) {
      fps = Math.round((frames * 1000) / (now - lastFpsAt));
      frames = 0;
      lastFpsAt = now;
    }
    requestAnimationFrame(pump);
  }
  requestAnimationFrame(pump);

  document.addEventListener("visibilitychange", () => { vis = document.visibilityState; });
  window.addEventListener("focus", () => { foc = 1; });
  window.addEventListener("blur", () => { foc = 0; });
  window.addEventListener("keydown", () => { kb++; });
  ta.addEventListener("beforeinput", () => { kb++; });
  ce.addEventListener("beforeinput", () => { kb++; });
  ta.addEventListener("input", () => { inp++; });
  ce.addEventListener("input", () => { inp++; });

  const clip = (s, n) => {
    s = (s || "").replace(/\s+/g, " ");
    return s.length > n ? s.slice(0, n) + "…" : s;
  };

  // 标题必须短：驱动侧用 300 字符的缓冲读它。
  // 顺序固定，方便肉眼比对两次采样之间的差量。
  function snap() {
    const secs = ((performance.now() - t0) / 1000).toFixed(0);
    const parts = [
      "R4BED",
      "t=" + secs,
      "raf=" + rafCount.n,
      "fps=" + fps,
      "vis=" + vis,
      "foc=" + (document.hasFocus() ? 1 : 0),
      "evf=" + foc,
      "ae=" + (document.activeElement ? (document.activeElement.id || document.activeElement.tagName) : "-"),
      "inp=" + inp,
      "kb=" + kb,
      "te=" + JSON.stringify(clip(ta.value, 28)),
      "td=" + JSON.stringify(clip(ce.innerText, 28)),
    ];
    const line = parts.join("|");
    document.title = line;
    box.textContent = line.split("|").join("\n");
  }

  setInterval(snap, 200);
  // 页面级的"把焦点放进 textarea"：这与 OS 前台是两回事，
  // 两边（隐藏桌面 / 用户桌面）都要做，才能让对照只差"前台"这一个变量。
  try { window.focus(); ta.focus(); } catch (e) {}
  snap();
})();
</script>
